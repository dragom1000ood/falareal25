<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FalaReal — loading avião</title>
<style>
  :root {
    --verde: #0f8a4b;
    --verde-claro: #22c56b;
    --bg: #0c1f16;
    --céu: #103824;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .loader-screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    color: #eafff2;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--verde-claro); }

  /* pista onde o avião cruza */
  .runway {
    position: relative;
    width: min(320px, 80vw);
    height: 40px;
  }
  .track {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: repeating-linear-gradient(
      to right,
      rgba(255,255,255,0.25) 0 10px,
      transparent 10px 20px
    );
    transform: translateY(-50%);
  }
  .plane {
    position: absolute;
    top: 50%;
    font-size: 26px;
    transform: translate(-50%, -50%) rotate(90deg);
    animation: cruzar 2.6s ease-in-out infinite;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
  }
  @keyframes cruzar {
    0%   { left: 0%;   transform: translate(-50%, -50%) rotate(90deg); }
    48%  { left: 100%; transform: translate(-50%, -50%) rotate(90deg); }
    50%  { left: 100%; transform: translate(-50%, -50%) rotate(-90deg); }
    98%  { left: 0%;   transform: translate(-50%, -50%) rotate(-90deg); }
    100% { left: 0%;   transform: translate(-50%, -50%) rotate(90deg); }
  }

  .texto {
    font-size: 14px;
    color: rgba(234,255,242,0.75);
  }
  .pontinhos::after {
    content: '';
    animation: pontos 1.4s steps(4, end) infinite;
  }
  @keyframes pontos {
    0%   { content: ''; }
    25%  { content: '.'; }
    50%  { content: '..'; }
    75%  { content: '...'; }
    100% { content: ''; }
  }
</style>
</head>
<body>
  <div class="loader-screen">
    <div class="logo">Fala<span>Real</span></div>
    <div class="runway">
      <div class="track"></div>
      <div class="plane">✈️</div>
    </div>
    <div class="texto pontinhos">carregando</div>
  </div>
</body>
</html>
