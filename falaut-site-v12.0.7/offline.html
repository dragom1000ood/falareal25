<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem conexão — FalaReal</title>
<meta name="theme-color" content="#0F2E1D">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root{
    --green:#0F2E1D; --gold:#C9A227; --cream:#EDE6D6; --brick:#B33A2E;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--green);
    color:var(--cream);
    font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:32px calc(24px + env(safe-area-inset-left,0px));
    text-align:center;
  }
  .wrap{max-width:420px}
  img{width:132px;height:132px;margin-bottom:28px}
  h1{font-size:23px;line-height:1.3;margin:0 0 12px;font-weight:700}
  p{font-size:15px;line-height:1.6;opacity:.85;margin:0 0 28px}
  .rule{width:64px;height:3px;background:var(--gold);border-radius:99px;margin:0 auto 26px}
  button{
    background:var(--gold);color:var(--green);border:0;border-radius:999px;
    padding:14px 30px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  }
  button:active{transform:scale(.97)}
  .hint{margin-top:22px;font-size:13px;opacity:.6}
  .dot{
    display:inline-block;width:8px;height:8px;border-radius:99px;
    background:var(--brick);margin-right:7px;vertical-align:1px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icons/icon-512.png" alt="FalaReal">
    <div class="rule"></div>
    <h1>Você está sem conexão</h1>
    <p>
      O FalaReal precisa de internet pra carregar esta parte.
      Assim que você voltar a ficar online, é só tocar em recarregar —
      seu progresso continua salvo no aparelho.
    </p>
    <button onclick="location.reload()">Tentar de novo</button>
    <div class="hint"><span class="dot"></span>alemão de verdade, sem sala de aula.</div>
  </div>
  <script>
    // volta sozinho assim que a conexão retorna
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
